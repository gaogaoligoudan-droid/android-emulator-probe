# Phase 0 探针：验证 GHA Linux runner 能否正常 boot 安卓模拟器（防 #478 挂起坑）
# 配置照抄 pachli-android 现行防坑六件套（简化版：快照两阶段留 Phase 1）
name: Android Emulator Probe (Phase 0)

on:
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ main ] # 首次 push 自动跑一次

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 兜底：#478 挂起形态 20 分钟自动杀

    steps:
      # 2-vCPU runner 启用 KVM（GitHub 官方 2024-04 changelog 步骤）
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # pin SHA = v2.38.0（2026-07-05 最新），防 tag 漂移
      - name: Boot emulator & probe
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            echo "=== adb devices ==="
            adb devices -l
            echo "=== 系统属性 ==="
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            echo "=== 屏幕截图 ==="
            adb exec-out screencap -p > probe-home.png
            ls -la probe-home.png
            echo "PROBE_OK"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-evidence
          path: probe-home.png
          if-no-files-found: ignore
